name: PR Size Check (Effective LOC)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  effective-loc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target uses the trusted default branch; NEVER check out the PR head here.
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test calculation
        run: node --test .github/scripts/pr-size.test.mjs
      - name: Compute and publish size report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/pr-size-runner.mjs
