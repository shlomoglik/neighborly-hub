name: Bootstrap pnpm lockfile
on:
  push:
    branches: [migration/nextjs-app-router]
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[pnpm-lock-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/nextjs-app-router
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build: generate pnpm lockfile [pnpm-lock-generated]"
            git push origin HEAD:migration/nextjs-app-router
          fi
