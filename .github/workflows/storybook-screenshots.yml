name: Storybook screenshots

# Visual review is explicitly requested, never part of automatic PR checks.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Install isolated screenshot tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/neighborly-capture" --no-save --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/neighborly-capture/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Capture localized Storybook screenshots
        run: |
          python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static > "$RUNNER_TEMP/storybook-server.log" 2>&1 &
          export PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/neighborly-capture/node_modules/playwright/index.mjs"
          node scripts/capture-storybook.mjs
      - name: Upload Storybook screenshots
        uses: actions/upload-artifact@v7
        with:
          name: storybook-screenshots
          path: artifacts/storybook
          if-no-files-found: error
          retention-days: 14
