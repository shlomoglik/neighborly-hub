name: Next.js checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting of changed source files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Base commit not available; skipping incremental formatting check"
            exit 0
          fi
          mapfile -d '' changed < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD)
          files=()
          for file in "${changed[@]}"; do
            case "$file" in
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.css|*.json)
                files+=("$file")
                ;;
            esac
          done
          if (("${#files[@]}" == 0)); then
            echo "No changed source files to format-check"
          else
            pnpm exec prettier --check --ignore-unknown "${files[@]}"
          fi
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Verify Storybook static build
        run: pnpm storybook:build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neighborly
          POSTGRES_PASSWORD: neighborly_test
          POSTGRES_DB: neighborly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neighborly -d neighborly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: neighborly
      PGPASSWORD: neighborly_test
      PGDATABASE: neighborly_test
    steps:
      - uses: actions/checkout@v7
      - name: Apply independent PostgreSQL schema
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/0001_initial.sql
      - name: Apply party subtype integrity migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/0002_party_subtype_integrity.sql
      - name: Apply authentication migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/0003_auth_sessions.sql
      - name: Apply resident identity migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/0004_resident_identity.sql
      - name: Apply invitation and join request migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/0005_invitations.sql
      - name: Apply private family and household invitation migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/0006_household_members.sql
      - name: Apply building address migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/0007_building_addresses.sql
      - name: Verify authentication constraints
        run: psql -v ON_ERROR_STOP=1 -f database/tests/auth-integrity.sql
      - name: Verify schema constraints and ownership
        run: psql -v ON_ERROR_STOP=1 -f database/tests/smoke.sql
      - name: Verify family scope constraints
        run: psql -v ON_ERROR_STOP=1 -f database/tests/family-integrity.sql
      - name: Verify party subtype constraints
        run: psql -v ON_ERROR_STOP=1 -f database/tests/party-integrity.sql
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify real database sessions and OAuth request boundaries
        env:
          AUTH_TEST_DATABASE_URL: postgresql://neighborly:neighborly_test@localhost:5432/neighborly_test
        run: pnpm exec vitest run --no-file-parallelism src/lib/auth/auth.integration.test.ts src/lib/access/directory.integration.test.ts src/lib/access/project-setup.integration.test.ts src/lib/access/management.integration.test.ts src/lib/access/staff.integration.test.ts src/lib/access/structure-management.integration.test.ts src/lib/access/invitations.integration.test.ts src/lib/access/households.integration.test.ts src/lib/access/family.integration.test.ts

  pilot-smoke:
    name: Pilot browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neighborly
          POSTGRES_PASSWORD: pilot_ci_only
          POSTGRES_DB: neighborly_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neighborly -d neighborly_pilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://neighborly:pilot_ci_only@127.0.0.1:5432/neighborly_pilot
      PILOT_E2E_DATABASE_URL: postgresql://neighborly:pilot_ci_only@127.0.0.1:5432/neighborly_pilot
      BETTER_AUTH_URL: https://127.0.0.1:3443
      BETTER_AUTH_SECRET: pilot-ci-only-not-for-real-deployments-32-characters
      GOOGLE_CLIENT_ID: pilot-not-a-real-google-client
      GOOGLE_CLIENT_SECRET: pilot-not-a-real-google-secret
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: neighborly
      PGPASSWORD: pilot_ci_only
      PGDATABASE: neighborly_pilot
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply authoritative migrations to isolated pilot database
        run: |
          for migration in database/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Build the actual production application
        run: pnpm build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/pilot-browser" --no-save --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/pilot-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Seed signed test sessions outside the application
        env:
          PILOT_FIXTURE_DIRECTORY: ${{ runner.temp }}/neighborly-pilot-private
        run: pnpm exec vitest run src/lib/access/pilot-fixture.integration.test.ts
      - name: Run desktop and mobile pilot journey over HTTPS
        env:
          PILOT_FIXTURE_DIRECTORY: ${{ runner.temp }}/neighborly-pilot-private
          PILOT_REPORT_DIRECTORY: artifacts/pilot
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/pilot-browser/node_modules/playwright/index.mjs
          PILOT_TLS_KEY: ${{ runner.temp }}/pilot-key.pem
          PILOT_TLS_CERT: ${{ runner.temp }}/pilot-cert.pem
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' -keyout "$PILOT_TLS_KEY" -out "$PILOT_TLS_CERT" >/dev/null 2>&1
          pnpm start --hostname 127.0.0.1 > "$RUNNER_TEMP/pilot-app.log" 2>&1 &
          app_pid=$!
          node scripts/pilot/https-proxy.mjs > "$RUNNER_TEMP/pilot-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$app_pid" "$proxy_pid" 2>/dev/null || true' EXIT
          node scripts/pilot/browser-smoke.mjs
      - name: Upload sanitized pilot result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-smoke-result
          path: artifacts/pilot/pilot-smoke.json
          if-no-files-found: ignore
          retention-days: 7
